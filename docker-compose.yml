version: '3.8'

services:
  # Backend FastAPI
  backend:
    build: ./backend
    container_name: llmops-backend
    ports:
      - "8000:8000"
    environment:
      - FIREBASE_ADMIN_KEY_PATH=/app/firebase-admin-key.json
      - FRONTEND_URL=http://localhost:5173
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ./backend:/app
      - ./backend/firebase-admin-key.json:/app/firebase-admin-key.json:ro
    restart: unless-stopped
    networks:
      - llmops-network

  # Frontend React (opcional - para produção)
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   container_name: llmops-frontend
  #   ports:
  #     - "80:80"
  #   environment:
  #     - VITE_API_URL=http://backend:8000
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - llmops-network

  # Nginx (opcional - reverse proxy para produção)
  # nginx:
  #   image: nginx:alpine
  #   container_name: llmops-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./dist:/usr/share/nginx/html:ro
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - llmops-network

networks:
  llmops-network:
    driver: bridge


